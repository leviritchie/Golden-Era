name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify release input checksum
        shell: pwsh
        run: |
          $expected = (Get-Content release_inputs/golden_era_release_payload.zip.sha256).Split(" ")[0].Trim().ToLowerInvariant()
          $actual = (Get-FileHash release_inputs/golden_era_release_payload.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "release input checksum mismatch: expected $expected actual $actual"
          }

      - name: Build installer package
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}"
          } else {
            $version = "manual-${{ github.run_number }}"
          }
          $out = "dist/Golden-Era-Mod-$version"
          powershell -ExecutionPolicy Bypass -File tools/release_installer/package_from_release_inputs.ps1 -OutputRoot $out -PackageVersion $version
          $safeVersion = $version -replace '[<>:"/\\|?*]', '_'
          "PACKAGE_EXE=$out/GoldenEraModInstaller-$safeVersion.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_SHA=$out/GoldenEraModInstaller-$safeVersion.exe.sha256" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build checksums
        shell: pwsh
        run: |
          $exe = $env:PACKAGE_EXE
          $sumPath = $env:PACKAGE_SHA
          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$exeHash  $([System.IO.Path]::GetFileName($exe))" | Set-Content -Path $sumPath -Encoding ASCII

      - name: Attest package
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ env.PACKAGE_EXE }}
            ${{ env.PACKAGE_SHA }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: golden-era-installer-exe
          archive: false
          path: ${{ env.PACKAGE_EXE }}

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v7
        with:
          name: golden-era-installer-sha256
          archive: false
          path: ${{ env.PACKAGE_SHA }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PACKAGE_EXE }}
            ${{ env.PACKAGE_SHA }}
          generate_release_notes: true
