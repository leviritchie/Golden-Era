name: rebuild installers

# Releases are assembled locally and uploaded as GitHub Release assets (no Git LFS).
# This workflow only rebuilds the thin installers for an existing release from that
# release's own payload assets, and uploads them as workflow artifacts. It never
# creates, edits or publishes a release, so publishing a draft release does not
# trigger it.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag whose payload assets should be used (for example v0.1.319)"
        required: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download payload parts from the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.tag }}"
          $safeVersion = $tag -replace '[<>:"/\\|?*]', '_'
          $payloadBase = "golden_era_release_payload-$safeVersion.zip"
          $dl = "dist/release-download"
          New-Item -ItemType Directory -Path $dl -Force | Out-Null
          gh release download $tag --repo "${{ github.repository }}" --dir $dl --pattern "$payloadBase.part*" --pattern "$payloadBase.sha256"
          if ($LASTEXITCODE -ne 0) { throw "gh release download failed" }
          New-Item -ItemType Directory -Path release_inputs -Force | Out-Null
          Get-ChildItem -LiteralPath $dl -File -Filter "$payloadBase.part*" | ForEach-Object {
            Move-Item -LiteralPath $_.FullName -Destination ("release_inputs/golden_era_release_payload.zip" + $_.Name.Substring($payloadBase.Length)) -Force
          }
          $sha = (Get-Content -LiteralPath "$dl/$payloadBase.sha256").Split(" ")[0].Trim().ToLowerInvariant()
          "$sha  golden_era_release_payload.zip" | Set-Content -Path release_inputs/golden_era_release_payload.zip.sha256 -Encoding ASCII
          "PACKAGE_VERSION=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PAYLOAD_BASE_NAME=$payloadBase" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_ROOT=dist/Golden-Era-Mod-$safeVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Assemble and verify release input
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tools/release_installer/assemble_release_input.ps1

      - name: Build thin installer packages
        shell: pwsh
        run: |
          $version = $env:PACKAGE_VERSION
          $payloadBase = $env:PAYLOAD_BASE_NAME
          $out = $env:PACKAGE_ROOT
          foreach ($variant in @(@{ Suffix = "-upscaled-portraits"; Upscaled = "true" }, @{ Suffix = "-standard-portraits"; Upscaled = "false" })) {
            powershell -ExecutionPolicy Bypass -File tools/release_installer/package_from_release_inputs.ps1 `
              -OutputRoot "$out/$($variant.Suffix.TrimStart('-'))" `
              -PackageVersion $version `
              -InstallerNameSuffix $variant.Suffix `
              -Homm3UseUpscaledHeroPortraits $variant.Upscaled `
              -PayloadMode Download `
              -PayloadBaseName $payloadBase
            if ($LASTEXITCODE -ne 0) { throw "packaging failed for $($variant.Suffix)" }
          }

      - name: Attest installers
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ env.PACKAGE_ROOT }}/*/GoldenEraModInstaller-*.exe

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: golden-era-installers-${{ inputs.tag }}
          path: |
            ${{ env.PACKAGE_ROOT }}/*/GoldenEraModInstaller-*.exe
            ${{ env.PACKAGE_ROOT }}/*/GoldenEraModInstaller-*.exe.sha256
