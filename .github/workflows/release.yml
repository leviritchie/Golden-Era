name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Assemble release input from LFS parts
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tools/release_installer/assemble_release_input.ps1

      - name: Verify release input checksum
        shell: pwsh
        run: |
          $expected = (Get-Content release_inputs/golden_era_release_payload.zip.sha256).Split(" ")[0].Trim().ToLowerInvariant()
          $actual = (Get-FileHash release_inputs/golden_era_release_payload.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "release input checksum mismatch: expected $expected actual $actual"
          }

      - name: Split shared payload for GitHub Release download
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}"
          } else {
            $version = "manual-${{ github.run_number }}"
          }
          $safeVersion = $version -replace '[<>:"/\\|?*]', '_'
          $payloadBase = "golden_era_release_payload-$safeVersion.zip"
          $assetDir = "dist/release-assets"
          if (Test-Path -LiteralPath $assetDir) {
            Remove-Item -LiteralPath $assetDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $assetDir -Force | Out-Null
          powershell -ExecutionPolicy Bypass -File tools/release_installer/split_release_asset.ps1 `
            -InputFile "release_inputs/golden_era_release_payload.zip" `
            -OutDir $assetDir `
            -OutputBaseName $payloadBase `
            -MaxPartBytes 1900000000
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PAYLOAD_BASE_NAME=$payloadBase" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_ROOT=dist/Golden-Era-Mod-$safeVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build thin installer packages
        shell: pwsh
        run: |
          $version = $env:PACKAGE_VERSION
          $payloadBase = $env:PAYLOAD_BASE_NAME
          $out = $env:PACKAGE_ROOT
          powershell -ExecutionPolicy Bypass -File tools/release_installer/package_from_release_inputs.ps1 `
            -OutputRoot "$out/upscaled-portraits" `
            -PackageVersion $version `
            -InstallerNameSuffix "-upscaled-portraits" `
            -Homm3UseUpscaledHeroPortraits true `
            -PayloadMode Download `
            -PayloadBaseName $payloadBase
          powershell -ExecutionPolicy Bypass -File tools/release_installer/package_from_release_inputs.ps1 `
            -OutputRoot "$out/standard-portraits" `
            -PackageVersion $version `
            -InstallerNameSuffix "-standard-portraits" `
            -Homm3UseUpscaledHeroPortraits false `
            -PayloadMode Download `
            -PayloadBaseName $payloadBase
          $safeVersion = $version -replace '[<>:"/\\|?*]', '_'
          "PACKAGE_EXE_UPSCALED=$out/upscaled-portraits/GoldenEraModInstaller-$safeVersion-upscaled-portraits.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_SHA_UPSCALED=$out/upscaled-portraits/GoldenEraModInstaller-$safeVersion-upscaled-portraits.exe.sha256" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_EXE_STANDARD=$out/standard-portraits/GoldenEraModInstaller-$safeVersion-standard-portraits.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_SHA_STANDARD=$out/standard-portraits/GoldenEraModInstaller-$safeVersion-standard-portraits.exe.sha256" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build checksums and stage release assets
        shell: pwsh
        run: |
          $assetDir = "dist/release-assets"
          foreach ($name in @("UPSCALED", "STANDARD")) {
            $exe = [System.Environment]::GetEnvironmentVariable("PACKAGE_EXE_$name")
            $sumPath = [System.Environment]::GetEnvironmentVariable("PACKAGE_SHA_$name")
            $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            "$exeHash  $([System.IO.Path]::GetFileName($exe))" | Set-Content -Path $sumPath -Encoding ASCII
            Copy-Item -LiteralPath $exe -Destination $assetDir -Force
            Copy-Item -LiteralPath $sumPath -Destination $assetDir -Force
          }

          $limit = [long]2147483648
          $oversized = @(Get-ChildItem -LiteralPath $assetDir -File | Where-Object { $_.Length -ge $limit })
          if ($oversized.Count -gt 0) {
            $names = ($oversized | ForEach-Object { "{0} ({1})" -f $_.Name, $_.Length }) -join ", "
            throw "Release assets still exceed GitHub 2GB limit: $names"
          }

          $thinLimit = [long]200MB
          foreach ($name in @("UPSCALED", "STANDARD")) {
            $exe = [System.Environment]::GetEnvironmentVariable("PACKAGE_EXE_$name")
            $len = (Get-Item -LiteralPath $exe).Length
            if ($len -ge $thinLimit) {
              throw "Thin installer is unexpectedly large ($len bytes): $exe"
            }
          }

          Get-ChildItem -LiteralPath $assetDir -File | Sort-Object Name | ForEach-Object {
            Write-Host ("{0} {1}" -f $_.Name, $_.Length)
          }

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $safeVersion = "${{ github.ref_name }}" -replace '[<>:"/\\|?*]', '_'
          $out = "dist/release-notes-$safeVersion.md"
          $tagNotes = "release_notes/${{ github.ref_name }}.md"
          if (Test-Path -LiteralPath $tagNotes) {
            Copy-Item -LiteralPath $tagNotes -Destination $out -Force
          } else {
            "# Golden Era ${{ github.ref_name }}`n`nNo curated release notes were committed for this tag." | Set-Content -Path $out -Encoding UTF8
          }
          "RELEASE_BODY=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Attest package
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ env.PACKAGE_EXE_UPSCALED }}
            ${{ env.PACKAGE_SHA_UPSCALED }}
            ${{ env.PACKAGE_EXE_STANDARD }}
            ${{ env.PACKAGE_SHA_STANDARD }}

      - name: Upload upscaled portrait installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: golden-era-installer-upscaled-portraits-exe
          archive: false
          path: ${{ env.PACKAGE_EXE_UPSCALED }}

      - name: Upload upscaled portrait checksum artifact
        uses: actions/upload-artifact@v7
        with:
          name: golden-era-installer-upscaled-portraits-sha256
          archive: false
          path: ${{ env.PACKAGE_SHA_UPSCALED }}

      - name: Upload standard portrait installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: golden-era-installer-standard-portraits-exe
          archive: false
          path: ${{ env.PACKAGE_EXE_STANDARD }}

      - name: Upload standard portrait checksum artifact
        uses: actions/upload-artifact@v7
        with:
          name: golden-era-installer-standard-portraits-sha256
          archive: false
          path: ${{ env.PACKAGE_SHA_STANDARD }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release-assets/*
          body_path: ${{ env.RELEASE_BODY }}
          generate_release_notes: true
          fail_on_unmatched_files: true
