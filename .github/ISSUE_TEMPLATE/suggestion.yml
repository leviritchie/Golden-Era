name: Suggestion
description: Suggest a feature, faction, quality-of-life change, visual improvement, or compatibility idea.
title: "[Suggestion]: "
labels: ["suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for new ideas. If something is broken, use Bug report. If something is overtuned or undertuned, use Balance issue.
  - type: dropdown
    id: category
    attributes:
      label: Suggestion category
      options:
        - New faction/content
        - Visual improvement
        - Quality of life
        - Installer/distribution
        - Compatibility
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the idea and why it would improve the mod.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Add screenshots, examples, or references if useful.
    validations:
      required: false
